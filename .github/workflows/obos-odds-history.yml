name: "OBOS: hent historiske sluttodds"

# Én gang i uken, etter at helgens runde er ferdigspilt og resultatene er inne,
# og manuelt ved behov. Kan kjøres flere ganger: skriptet hopper over kamper som
# alt er hentet, og lagrer etter hver kamp, så en avbrutt kjøring fortsetter.
# /v4/historical-odds er gratis, og terminlisten leses fra mellomlageret
# obos/data/oddspapi_fixtures_2026.json, så en planlagt kjøring koster
# 0 tellende kall. Bare --refresh-fixtures koster 1.
on:
  schedule:
    # Mandag 08.40 norsk tid hele året, etter resultatjobben: én linje for
    # sommertid (UTC+2) og én for vintertid (UTC+1); jobben «klokke» slipper
    # gjennom den som gjelder.
    - cron: "40 6 * * 1"   # mandag 08.40 norsk sommertid
    - cron: "40 7 * * 1"   # mandag 08.40 norsk vintertid
  workflow_dispatch:
    inputs:
      max:
        description: "Høyst så mange kamper denne kjøringen"
        default: "250"
      report_only:
        description: "Bare navnesjekk, ingen odds"
        type: boolean
        default: false
      sesong:
        description: "Sesong. 2026 = inneværende. Eldre år = TILBAKEFYLL til obos/data/odds-historikk/. Et tilbakefyll koster 1 tellende kall for terminlisten; selve oddsen er gratis."
        default: "2026"

permissions:
  contents: write

concurrency:
  group: obos-odds-history
  cancel-in-progress: false

jobs:
  # Planlagte kjøringer: to cron-linjer, én for sommertid og én for
  # vintertid. Jobben under slipper bare gjennom den som gjelder i dag
  # (scripts/norsk_klokke.py, etter den PLANLAGTE tiden, så en forsinket
  # kjøring ikke går tapt); den andre avslutter med en gang. Andre hendelser
  # (planleggeren, manuelt) hopper over sjekken.
  klokke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kjor: ${{ steps.klokke.outputs.kjor }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/norsk_klokke.py
          sparse-checkout-cone-mode: false
      - name: Er denne cron-linja 08.40 norsk tid i dag?
        id: klokke
        env:
          HENDELSE: ${{ github.event_name }}
          PLAN: ${{ github.event.schedule }}
        run: python3 scripts/norsk_klokke.py 8

  fetch:
    needs: klokke
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.klokke.outputs.kjor == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Hent sluttodds
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python3 scripts/obos_closing_odds.py \
            --sesong "${{ inputs.sesong || '2026' }}" \
            --max "${{ inputs.max || '250' }}" ${{ inputs.report_only && '--report' || '' }}

      - name: Lagre det som ble hentet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Hver fil for seg, så én manglende fil ikke stopper lagringen av de andre.
          for f in data/hentelogg data/nff-cache eliteserien/data/oddspapi_markets.json obos/data/oddspapi_markets.json obos/data/odds_closing.json obos/data/oddspapi_fixtures_2026.json data/oddspapi_usage.json data/oddspapi-bruk obos/data/odds-historikk; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Ingenting nytt."
          else
            git commit -m "OBOS: sluttodds hentet $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            bash scripts/push_med_rebase.sh
          fi
