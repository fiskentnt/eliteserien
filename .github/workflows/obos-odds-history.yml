name: "OBOS: hent historiske sluttodds"

# Én gang i uken, etter at helgens runde er ferdigspilt og resultatene er inne,
# og manuelt ved behov. Kan kjøres flere ganger: skriptet hopper over kamper som
# alt er hentet, og lagrer etter hver kamp, så en avbrutt kjøring fortsetter.
# /v4/historical-odds er gratis, og terminlisten leses fra mellomlageret
# obos/data/oddspapi_fixtures_2026.json, så en planlagt kjøring koster
# 0 tellende kall. Bare --refresh-fixtures koster 1.
on:
  schedule:
    - cron: "40 6 * * 1"   # mandag 08.40 norsk sommertid, etter resultatjobben
  workflow_dispatch:
    inputs:
      max:
        description: "Høyst så mange kamper denne kjøringen"
        default: "250"
      report_only:
        description: "Bare navnesjekk, ingen odds"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: obos-odds-history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Hent sluttodds
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python3 scripts/obos_closing_odds.py \
            --max "${{ inputs.max || '250' }}" ${{ inputs.report_only && '--report' || '' }}

      - name: Lagre det som ble hentet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Hver fil for seg, så én manglende fil ikke stopper lagringen av de andre.
          for f in obos/data/odds_closing.json obos/data/oddspapi_fixtures_2026.json data/oddspapi_usage.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Ingenting nytt."
          else
            git commit -m "OBOS: sluttodds hentet $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
