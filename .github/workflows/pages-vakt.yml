name: "Pages-vakt: er alt publisert?"

# 6.10.2026 hang publiseringen (pages build and deployment) i deploy fra
# kl. 15:17Z, og siden viste commiten før i over sju timer uten at noen
# merket det. Vakten sjekker at alt på main er publisert, med 30 minutter
# slingringsmonn, og varsler samme vei som de andre: healthchecks.io-sjekken
# tabellkalkulator-pages (livstegn når alt er i orden, /fail når det henger).
# Se scripts/pages_vakt.py og planlegger/README.md («Dødmannsknapp»).
#
# UTLØSES (7.10.2026):
#   - etter hver kjøring av «Oppdater kampdata», som planleggeren starter
#     hvert tiende minutt 09-21 UTC, uansett hvordan den gikk
#   - etter en publisering: page_build (byggingen er ferdig). GitHub starter
#     den bare for pusher fra en person, ikke for jobbenes egne pusher med
#     GITHUB_TOKEN; dem fanger kjøringen hvert tiende minutt. workflow_run på
#     «pages build and deployment» (GitHub sin egen) ble prøvd 7.10.2026 og
#     startet ingenting.
#   - om natten én gang i timen av planleggeren (planlegger/worker.js,
#     NATT_WORKFLOWS), med GitHub sin egen cron som reserve (den er sterkt
#     strupet for dette repoet, se workeren)
#   - manuelt
on:
  workflow_run:
    workflows: ["Oppdater kampdata"]
    types: [completed]
  page_build:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      planlagt:
        description: "Utløst av den eksterne planleggeren (ingen betydning for vakten)"
        type: boolean
        default: false

# Bare lesing: deployments (publiseringene) og compare (commitene).
permissions:
  contents: read
  deployments: read

# Ingen concurrency-gruppe: vakten bare leser, og to samtidige kjøringer gjør
# ingen skade. En gruppe ville gitt avbrutte kjøringer (GitHub holder bare én
# ventende), og dermed e-post.

jobs:
  vakt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/pages_vakt.py
          sparse-checkout-cone-mode: false

      - name: Er alt på main publisert?
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HC_URL: ${{ secrets.HEALTHCHECK_PAGES }}
        run: python3 scripts/pages_vakt.py
