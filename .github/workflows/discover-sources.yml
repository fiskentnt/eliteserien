name: Finn liga-ID-er (manuell)

# Kjøres bare manuelt, og bare når vi trenger å slå opp ID-er hos kildene.
# Nøkkelen ligger som secret og skrives aldri ut -- se scripts/discover_sources.py.
on:
  workflow_dispatch:
    inputs:
      oddspapi_probe:
        description: "Kartlegg OddsPapi-kontoen (5 tellende kall)"
        type: boolean
        default: false
      oddspapi_probe2:
        description: "Runde to: bookmakere, OBOS-kamper, odds (2 tellende kall)"
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-24.04   # låst 8.10.2026: ubuntu-latest blir Ubuntu 26 fra 19.10.
    steps:
      - uses: actions/checkout@v7
      - name: Slå opp turneringer hos OddsPapi
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python3 scripts/discover_sources.py

      - name: Kartlegg OddsPapi-kontoen
        if: inputs.oddspapi_probe
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python3 scripts/oddspapi_probe.py

      - name: OddsPapi runde to
        if: inputs.oddspapi_probe2
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python3 scripts/oddspapi_probe2.py
