name: Oppdater kampdata

on:
  schedule:
    # Hvert 20. minutt norsk kveld/dag (12-23), hver time ellers. Var hvert
    # kvarter døgnet rundt, men GitHub nedprioriterer og dropper kjøringer på
    # hyppige planer, spesielt på nye repoer (se undersøkelsen 2026-09-20:
    # null av de planlagte kjøringene hadde gått etter 5+ timer, bare de
    # manuelle). Klokkeslettene under er UTC og forutsetter norsk sommertid
    # (UTC+2) — må skyves én time når vintertiden begynner i slutten av
    # oktober. Selve kjøringen er uansett billig å avslutte tidlig — se
    # scripts/should_fetch.py, som avgjør om det faktisk er noe å hente ut
    # fra eliteserien/data/fixtures.json (en kamp som startet for >105 min siden uten
    # resultat), ikke faste kampdager her i cronen. Ikke runde klokkeslett
    # (minutt 5/25/45 og 7), som GitHub sin planlegger ofte utsetter/dropper.
    - cron: "5,25,45 10-20 * * *"  # kl 12-22 norsk tid, hvert 20. minutt
    - cron: "7 21-23,0-9 * * *"    # kl 23-11 norsk tid, hver time
  workflow_dispatch:
    inputs:
      planlagt:
        description: "Utlost av den eksterne planleggeren -- porten og kampvinduet skal gjelde som ved schedule"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sjekk om noe faktisk trenger henting (ingen avhengigheter, raskt)
        id: gate
        env:
          # Den eksterne planleggeren sender planlagt=true og skal behandles
          # som en schedule-kjoring: porten avgjor. En manuell kjoring uten
          # flagget tvinger fortsatt henting.
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && !inputs.planlagt && 'true' || 'false' }}
        run: python3 scripts/should_fetch.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_fetch == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter (numpy, scipy)
        if: steps.gate.outputs.should_fetch == 'true'
        run: pip install -r requirements.txt

      - name: Kjør oppdateringsscript (kamper, sluttodds og modell)
        if: steps.gate.outputs.should_fetch == 'true'
        env:
          # Sluttodds fra OddsPapi-vinduet. Gratis oppslag. Mangler nøkkelen,
          # hopper update_data.py over steget og bruker football-data som før.
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python3 scripts/update_data.py

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.should_fetch == 'true'
        with:
          node-version: "22"

      - name: Lagre sannsynlighetene etter nye resultater (historikk)
        if: steps.gate.outputs.should_fetch == 'true'
        continue-on-error: true  # historikken skal aldri stoppe datoppdateringen
        run: |
          # Åpner selve siden i Chrome (ligger på kjøreren) og leser tallene tabellen
          # viser, se scripts/snapshot_probs.js. Legger bare til et punkt når
          # resultatene er endret siden forrige.
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pp" puppeteer-core@25.11.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)" \
          NODE_PATH="$RUNNER_TEMP/pp/node_modules" node scripts/snapshot_probs.js

      - name: Treffsikkerhetslogg (lagrede sannsynligheter mot resultat)
        if: steps.gate.outputs.should_fetch == 'true'
        continue-on-error: true  # skal aldri stoppe datoppdateringen
        run: python3 scripts/accuracy_log.py eliteserien

      - name: Lag delingsbilde (toppen av tabellen) og sitemap
        if: steps.gate.outputs.should_fetch == 'true'
        continue-on-error: true  # et feilet bilde skal ikke stoppe datoppdateringen
        run: |
          python3 scripts/make_og.py --league
          python3 scripts/make_sitemap.py

      - name: Daglig revisjon av terminlisten mot fotball.no
        id: revisjon
        # Den ENESTE uavhengige kontrollen eliteserien har paa runde, dato og
        # avspark. De 22 feilene vi rettet 25. september var nettopp saann
        # data. Et kritisk avvik gjor stempelet rodt til en ny revisjon
        # bekrefter at det er borte.
        #
        # nff_source henter hoyst en gang i dognet av seg selv, saa dette
        # steget koster ingen ekstra forespørsel naar noe annet alt har hentet.
        if: steps.gate.outputs.should_fetch == 'true'
        run: python3 scripts/daglig_revisjon.py eliteserien

      - name: Sesongskifte (eliteserien) -- bytter bare 1. januar
        id: sesongskifte
        continue-on-error: true
        # data/sesonger.json er autoriteten datovakten leser. Da kan
        # sesongskiftet ikke ligge som kode ingen kjorer.
        #
        # Dette er en no-op 364 dager i aaret: skal_bytte() returnerer False
        # med begrunnelse, ingenting skrives, og exitkoden er 0. Fra 1. januar
        # bytter den bare hvis neste sesong er validert (status "klar").
        # --liga: Eliteserie-kjeden skal ikke kunne bytte OBOS sin sesong.
        #
        # Er byttedatoen passert UTEN at neste sesong er klar, gir den
        # exit 1. Da fanges det av steget nederst, etter at lagringen har
        # rukket aa kjore.
        #
        # OPPDAGELSEN av neste sesongs terminliste er IKKE med her -- se
        # TODO.md, frist 1. november.
        if: steps.gate.outputs.should_fetch == 'true'
        run: python3 scripts/sesong.py . bytt --liga eliteserien --utfor

      - name: Committer og pusher hvis noe endret seg
        if: always() && steps.gate.outputs.should_fetch == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eliteserien/data/matches.json eliteserien/data/fixtures.json eliteserien/data/odds_fd.json eliteserien/data/odds.json eliteserien/data/model.json eliteserien/data/status.json eliteserien/data/daglig_state.json
          [ -f eliteserien/data/odds_closing.json ] && git add eliteserien/data/odds_closing.json
          [ -f eliteserien/data/oddspapi_fixtures_2026.json ] && git add eliteserien/data/oddspapi_fixtures_2026.json
          [ -f eliteserien/data/oddspapi_markets.json ] && git add eliteserien/data/oddspapi_markets.json
          [ -f data/oddspapi_usage.json ] && git add data/oddspapi_usage.json
          # Katalogen finnes bare naar et tellende kall er gjort i dag.
          [ -d data/oddspapi-bruk ] && git add data/oddspapi-bruk
          # fotball.no-cachen: hoyst ett forsok per liga per dogn ligger her.
          [ -d data/nff-cache ] && git add data/nff-cache
          [ -f eliteserien/data/audit_fixtures.json ] && git add eliteserien/data/audit_fixtures.json
          [ -f eliteserien/data/ffk_cache.json ] && git add eliteserien/data/ffk_cache.json
          [ -f eliteserien/data/audit_state.json ] && git add eliteserien/data/audit_state.json
          [ -f eliteserien/data/history.json ] && git add eliteserien/data/history.json
          [ -f eliteserien/data/keymatch.json ] && git add eliteserien/data/keymatch.json
          [ -f eliteserien/data/lastmatch.json ] && git add eliteserien/data/lastmatch.json
          [ -f eliteserien/data/prekick.json ] && git add eliteserien/data/prekick.json
          [ -f eliteserien/data/accuracy.json ] && git add eliteserien/data/accuracy.json
          git add eliteserien/og.png sitemap.xml
          if git diff --cached --quiet; then
            echo "Ingen endringer i kampdata."
          else
            git commit -m "Oppdater kampdata $(date -u +%Y-%m-%dT%H:%MZ)"
            bash scripts/push_med_rebase.sh
          fi

      - name: Gjør kjøringen rød hvis sesongskiftet varslet
        # Steget over har continue-on-error, saa resten av kjeden -- inkludert
        # lagringen -- rekker aa fullfore. Men en passert byttedato med en
        # sesong som ikke er klar skal ikke ende gront.
        if: always() && steps.sesongskifte.outcome == 'failure'
        run: |
          echo "::error title=Sesongskiftet er ikke klart::Byttedatoen er passert, men neste sesong er ikke oppdaget og validert. Siden viser en ferdigspilt sesong. Se loggen for steget «Sesongskifte»."
          exit 1
