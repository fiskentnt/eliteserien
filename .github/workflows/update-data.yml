name: Oppdater kampdata

on:
  schedule:
    # Hvert 20. minutt norsk kveld/dag (12-23), hver time ellers. Var hvert
    # kvarter døgnet rundt, men GitHub nedprioriterer og dropper kjøringer på
    # hyppige planer, spesielt på nye repoer (se undersøkelsen 2026-09-20:
    # null av de planlagte kjøringene hadde gått etter 5+ timer, bare de
    # manuelle). Klokkeslettene under er UTC og forutsetter norsk sommertid
    # (UTC+2) — må skyves én time når vintertiden begynner i slutten av
    # oktober. Selve kjøringen er uansett billig å avslutte tidlig — se
    # scripts/should_fetch.py, som avgjør om det faktisk er noe å hente ut
    # fra eliteserien/data/fixtures.json (en kamp som startet for >105 min siden uten
    # resultat), ikke faste kampdager her i cronen. Ikke runde klokkeslett
    # (minutt 5/25/45 og 7), som GitHub sin planlegger ofte utsetter/dropper.
    - cron: "5,25,45 10-20 * * *"  # kl 12-22 norsk tid, hvert 20. minutt
    - cron: "7 21-23,0-9 * * *"    # kl 23-11 norsk tid, hver time
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sjekk om noe faktisk trenger henting (ingen avhengigheter, raskt)
        id: gate
        env:
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python3 scripts/should_fetch.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_fetch == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter (numpy, scipy)
        if: steps.gate.outputs.should_fetch == 'true'
        run: pip install -r requirements.txt

      - name: Kjør oppdateringsscript (kamper, sluttodds og modell)
        if: steps.gate.outputs.should_fetch == 'true'
        run: python3 scripts/update_data.py

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.should_fetch == 'true'
        with:
          node-version: "22"

      - name: Lagre sannsynlighetene etter nye resultater (historikk)
        if: steps.gate.outputs.should_fetch == 'true'
        continue-on-error: true  # historikken skal aldri stoppe datoppdateringen
        run: |
          # Åpner selve siden i Chrome (ligger på kjøreren) og leser tallene tabellen
          # viser, se scripts/snapshot_probs.js. Legger bare til et punkt når
          # resultatene er endret siden forrige.
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pp" puppeteer-core@25.11.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)" \
          NODE_PATH="$RUNNER_TEMP/pp/node_modules" node scripts/snapshot_probs.js

      - name: Lag delingsbilde (toppen av tabellen) og sitemap
        if: steps.gate.outputs.should_fetch == 'true'
        continue-on-error: true  # et feilet bilde skal ikke stoppe datoppdateringen
        run: |
          python3 scripts/make_og.py --league
          python3 scripts/make_sitemap.py

      - name: Committer og pusher hvis noe endret seg
        if: always() && steps.gate.outputs.should_fetch == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eliteserien/data/matches.json eliteserien/data/fixtures.json eliteserien/data/odds_fd.json eliteserien/data/odds.json eliteserien/data/model.json eliteserien/data/status.json
          [ -f eliteserien/data/ffk_cache.json ] && git add eliteserien/data/ffk_cache.json
          [ -f eliteserien/data/audit_state.json ] && git add eliteserien/data/audit_state.json
          [ -f eliteserien/data/history.json ] && git add eliteserien/data/history.json
          git add eliteserien/og.png sitemap.xml
          if git diff --cached --quiet; then
            echo "Ingen endringer i kampdata."
          else
            git commit -m "Oppdater kampdata $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
