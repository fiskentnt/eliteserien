name: "Grunnlag: tabellen og svarene regnet på forhånd"

# Grunnlagsfilen (<liga>/data/grunnlag.json): tabellen og svarene med låste
# utfall for dagens stilling, regnet med N = 100 000 sesonger per oppgave med
# sidens egen kode (scripts/lag_grunnlag.js, grunnlagRegn() på siden).
#
# Egen workflow, ikke et steg i datajobbene: den kan verken forsinke eller
# stoppe dem, og den fanger også oddsendringene fra «Oppdater odds for
# kommende kamper» og «Odds nær avspark». Den utløses etter hver kjøring av
# jobbene som skriver det siden regner med, ved push av sidene eller
# skriptet, og manuelt.
#
# Testsiden (elo-test/emodell/grunnlag.json, med ELO-Odds 90) regnes her
# også, etter «ELO-test: bygg modellen», som bygger modellen den regner med.
# Ikke som et steg i elo-test.yml: da ville en lang regning (om lag en time
# ved sesongstart) holdt av køen for byggingen av modellen.
#
# Porten (scripts/grunnlag_port.py) ser om inndataene er endret siden filen
# ble regnet. Nesten alle kjøringene stopper der, etter noen sekunder, uten
# nettleser. Fast N på én maskin per liga, i kø per liga: bare den nyeste
# ventende jobben står i kø, og den sjekker porten på nytt før den regner.
#
# Banneret (keymatch.json i samme mappe) regnes i samme kjøring, fra den
# nye filen, så banneret og svaret bygger på de samme tallene. Datajobbene
# skriver det ikke lenger.
#
# Feiler regningen, skrives ingen fil, og den forrige blir stående. Siden
# bruker filen bare når fingeravtrykket stemmer med det den selv regner, og
# regner ellers selv, som før.
on:
  workflow_run:
    workflows:
      - "Oppdater kampdata"
      - "Oppdater odds for kommende kamper"
      - "Odds nær avspark"
      - "OBOS: hent resultater"
      - "Bygg ligasidene"
      - "ELO-test: bygg modellen"
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - eliteserien/index.html
      - obos/index.html
      - elo-test/index.html
      - eliteserien/data/justeringer.json
      - obos/data/justeringer.json
      - scripts/lag_grunnlag.js
      - scripts/grunnlag_port.py
      - .github/workflows/grunnlag.yml
  workflow_dispatch:
    inputs:
      tving:
        description: "Regn begge ligaene selv om inndataene er uendret"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ligaer: ${{ steps.port.outputs.ligaer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Etter «ELO-test: bygg modellen» bare testsiden, etter de andre
      # jobbene bare ligaene (testsidens modell er ikke bygget ennå), ellers
      # alle tre.
      - name: Er inndataene endret siden filen ble regnet?
        id: port
        env:
          TVING: ${{ inputs.tving && 'true' || 'false' }}
          UTLOSER: ${{ github.event.workflow_run.name || '' }}
        run: |
          case "$UTLOSER" in
            "ELO-test: bygg modellen") sider="elo-test" ;;
            "") sider="eliteserien obos elo-test" ;;
            *) sider="eliteserien obos" ;;
          esac
          python3 scripts/grunnlag_port.py $sider

  regn:
    needs: port
    if: needs.port.outputs.ligaer != '[]'
    strategy:
      fail-fast: false
      matrix:
        liga: ${{ fromJSON(needs.port.outputs.ligaer) }}
    concurrency:
      group: grunnlag-${{ matrix.liga }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Regnetiden er proporsjonal med oppgaver x åpne kamper x N: 5,5 min for
    # Eliteserien i september 2026 (72 åpne kamper), men om lag en time ved
    # sesongstart (om lag 240 åpne kamper). Se TODO.md om parallelle jobber.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Porten på nytt: jobben kan ha ventet i kø mens en annen regnet de
      # samme inndataene ferdig.
      - name: Fortsatt endret?
        id: port
        env:
          TVING: ${{ inputs.tving && 'true' || 'false' }}
        run: python3 scripts/grunnlag_port.py "${{ matrix.liga }}"

      - uses: actions/setup-node@v4
        if: steps.port.outputs.ligaer != '[]'
        with:
          node-version: "22"

      - name: Installer puppeteer-core
        if: steps.port.outputs.ligaer != '[]'
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pp" puppeteer-core@25.11.0

      - name: Regn grunnlagsfilen (N = 100 000)
        if: steps.port.outputs.ligaer != '[]'
        env:
          INNDATA: ${{ steps.port.outputs.inndata }}
          UT: ${{ steps.port.outputs.ut }}
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)" \
          NODE_PATH="$RUNNER_TEMP/pp/node_modules" node scripts/lag_grunnlag.js "${{ matrix.liga }}" --ut "$UT" --inndata "$INNDATA"

      - name: Lagre
        if: steps.port.outputs.ligaer != '[]'
        env:
          UT: ${{ steps.port.outputs.ut }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$UT/grunnlag.json"
          [ -f "$UT/keymatch.json" ] && git add "$UT/keymatch.json"
          if git diff --cached --quiet; then echo "Uendret."; exit 0; fi
          git commit -q -m "Grunnlag (${{ matrix.liga }}) $(date -u +%Y-%m-%dT%H:%MZ)"
          bash scripts/push_med_rebase.sh
