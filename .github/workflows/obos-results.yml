name: "OBOS: hent resultater"

# Én gang i døgnet, og manuelt ved behov. OddsPapi er hovedkilde (kampliste +
# /v4/scores per nyspilt kamp), Wikipedia er kontroll og reserve. Ingenting
# publiseres uten at valideringen går gjennom -- se scripts/obos_results.py.
on:
  schedule:
    - cron: "17 5 * * *"   # 07.17 norsk sommertid
  workflow_dispatch:
    inputs:
      planlagt:
        description: "Utlost av den eksterne planleggeren -- porten skal gjelde som ved schedule"
        type: boolean
        default: false
      forget_round:
        description: "Glem denne runden først, for å vise at kjeden henter den på nytt"
        default: ""
      dry_run:
        description: "Bare vis hva som ville skjedd"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: obos-results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Point-in-time-arkiv i det PRIVATE lab-repoet, samme mønster som
      # update-odds.yml. Arkiveres FØR hentingen kan overskrive snapshotet,
      # så et snapshot som gikk tapt sist blir fanget, og etterpå på nytt.
      # Idempotent: filnavnet er hentetidspunktet.
      #
      # Ligger rett etter checkout, uten dry_run-betingelse: en kjoring som
      # ikke henter ny odds skal likevel arkivere det som ligger fra sist.
      # Skriptet bruker bare standardbibliotek.
      - name: Arkiver forrige oddssnapshot (før henting)
        id: ark_for
        continue-on-error: true
        env:
          LAB_DEPLOY_KEY: ${{ secrets.LAB_DEPLOY_KEY }}
        run: bash scripts/arkiver_til_lab.sh for-henting obos

      - name: Sjekk om noe faktisk trenger henting (sparer OddsPapi-kvote)
        id: gate
        env:
          # Hvert kall mot OddsPapi teller mot en kvote paa 250 i maaneden.
          # Den eksterne planleggeren kaller hvert 10. minutt, saa uten denne
          # porten ville kvoten vaert brukt opp paa tre dager.
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && !inputs.planlagt && 'true' || 'false' }}
        run: python3 scripts/should_fetch.py obos

      - name: Hent og valider resultater
        if: steps.gate.outputs.should_fetch == 'true'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python3 scripts/obos_results.py \
            ${{ inputs.forget_round && format('--forget-round {0}', inputs.forget_round) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Selve resultathentingen over bruker bare standardbiblioteket, så den
      # kjører uansett. Modelltilpasningen trenger numpy og scipy, og
      # delingsbildet Pillow -- ingen av dem er forhåndsinstallert på runneren.
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter
        if: steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
        run: python3 -m pip install --quiet -r requirements.txt

      # Odds for kommende kamper: blandes inn per kamp på siden. Gratis
      # oppslag; bare terminlisten koster ett kall, og den mellomlagres.
      # Feiler den, er det ikke kritisk -- siden faller tilbake til modellen.
      - name: Hent odds for kommende kamper
        id: odds
        if: steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
        continue-on-error: true
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python3 scripts/obos_upcoming_odds.py

      - name: Arkiver nytt oddssnapshot (etter henting)
        id: ark_etter
        if: steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
        continue-on-error: true
        env:
          LAB_DEPLOY_KEY: ${{ secrets.LAB_DEPLOY_KEY }}
        run: bash scripts/arkiver_til_lab.sh etter-henting obos

      # Arkiveringen skal ikke velte resultatoppdateringen, men et tapt
      # snapshot er en observasjon vi ikke får igjen. Feilen skrives derfor i
      # jobbsammendraget, med liga og hvilken fase det gjelder.
      - name: Meld om arkiveringsfeil
        if: always()
        run: |
          feil=0
          for x in "for-henting:${{ steps.ark_for.outcome }}" \
                   "etter-henting:${{ steps.ark_etter.outcome }}"; do
            fase="${x%%:*}"; res="${x##*:}"
            if [ "$res" = "failure" ]; then
              echo "### Arkivering feilet: OBOS, $fase" >> "$GITHUB_STEP_SUMMARY"
              echo "Snapshotet kan være tapt. Se git-historikken til" >> "$GITHUB_STEP_SUMMARY"
              echo "\`obos/data/odds_upcoming.json\` for å hente det inn manuelt." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Arkivering feilet::OBOS, $fase"
              feil=1
            fi
          done
          [ "$feil" = "0" ] && echo "Arkivering OK (begge faser)." >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Bygg tabell og modell på nytt
        id: bygg
        if: steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
        run: python3 scripts/obos_build_data.py --from-matches

      # Rundens viktigste kamp, hva forrige kamp betydde, historikken, og
      # sannsynlighetene før avspark. Leses ut av selve siden i Chrome, så
      # tallene er de samme som tabellen viser. Samme skript som Eliteserien.
      - name: Rundens viktigste kamp, forrige kamp og historikk
        if: steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
        continue-on-error: true  # skal aldri stoppe resultatene
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pp" puppeteer-core@25.11.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)" \
          NODE_PATH="$RUNNER_TEMP/pp/node_modules" node scripts/snapshot_probs.js obos

      - name: Treffsikkerhetslogg (lagrede sannsynligheter mot resultat)
        id: logg
        if: steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
        continue-on-error: true  # skal aldri stoppe resultatene
        run: python3 scripts/accuracy_log.py obos

      - name: Daglig revisjon av terminlisten mot fotball.no
        id: revisjon
        # Den ENESTE uavhengige kontrollen obos har paa runde, dato og
        # avspark. De 22 feilene vi rettet 25. september var nettopp saann
        # data. Et kritisk avvik gjor stempelet rodt til en ny revisjon
        # bekrefter at det er borte.
        #
        # nff_source henter hoyst en gang i dognet av seg selv, saa dette
        # steget koster ingen ekstra forespørsel naar noe annet alt har hentet.
        if: steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
          && steps.bygg.outcome == 'success'
        run: python3 scripts/daglig_revisjon.py obos

      - name: Merk daglig vedlikehold som utført
        # SISTE steg for lagring, og bare naar DET DAGLIGE ARBEIDET faktisk
        # ble gjort: oddsen for kommende kamper, tabellen og modellen bygget
        # med den, og treffsikkerhetsloggen. Delingsbildet er ikke en del av
        # vedlikeholdet og staar derfor etter.
        #
        # success() alene duger IKKE: to av stegene har continue-on-error, og
        # da regner success() dem som vellykkede selv naar de feilet. Derfor
        # sjekkes outcome for hvert av dem -- outcome er raaresultatet.
        if: >-
          steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
          && steps.odds.outcome == 'success'
          && steps.bygg.outcome == 'success'
          && steps.logg.outcome == 'success'
          && steps.revisjon.outcome == 'success' 
        run: python3 scripts/merk_daglig.py obos

      - name: Sesongskifte (obos) -- bytter bare 1. januar
        id: sesongskifte
        continue-on-error: true
        # data/sesonger.json er autoriteten datovakten leser. Da kan
        # sesongskiftet ikke ligge som kode ingen kjorer.
        #
        # Dette er en no-op 364 dager i aaret: skal_bytte() returnerer False
        # med begrunnelse, ingenting skrives, og exitkoden er 0. Fra 1. januar
        # bytter den bare hvis neste sesong er validert (status "klar").
        # --liga: Eliteserie-kjeden skal ikke kunne bytte OBOS sin sesong.
        #
        # Er byttedatoen passert UTEN at neste sesong er klar, gir den
        # exit 1. Da fanges det av steget nederst, etter at lagringen har
        # rukket aa kjore.
        #
        # OPPDAGELSEN av neste sesongs terminliste er IKKE med her -- se
        # TODO.md, frist 1. november.
        if: steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
        run: python3 scripts/sesong.py . bytt --liga obos --utfor

      - name: Tegn delingsbildet på nytt
        if: steps.gate.outputs.should_fetch == 'true' && !inputs.dry_run
        continue-on-error: true  # et feilet bilde skal ikke stoppe resultatene
        run: python3 scripts/make_og.py --obos

      - name: Lagre hvis noe endret seg
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Hver fil for seg: én felles "git add" avvises HELT hvis én av filene
          # mangler, og da ble ingenting lagret -- heller ikke nye resultater.
          # (Skjedde 22. september: oddshentingen feilet, én fil ble ikke laget,
          # og det nye banneret ble aldri lagret.)
          for f in obos/data/audit_fixtures.json data/nff-cache obos/data/daglig_state.json data/oddspapi_usage.json data/oddspapi-bruk obos/data/matches.json obos/data/fixtures.json obos/data/model.json \
                   obos/data/status.json obos/data/results_state.json \
                   obos/data/oddspapi_fixtures_2026.json obos/data/oddspapi_markets.json obos/og.png \
                   obos/data/odds_upcoming.json \
                   obos/data/keymatch.json obos/data/lastmatch.json \
                   obos/data/history.json obos/data/prekick.json \
                   obos/data/accuracy.json \
                   data/oddspapi_usage.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Ingen endringer."
          else
            git commit -m "OBOS: resultater oppdatert $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            bash scripts/push_med_rebase.sh
          fi

      - name: Gjør kjøringen rød hvis sesongskiftet varslet
        # Steget over har continue-on-error, saa resten av kjeden -- inkludert
        # lagringen -- rekker aa fullfore. Men en passert byttedato med en
        # sesong som ikke er klar skal ikke ende gront.
        if: always() && steps.sesongskifte.outcome == 'failure'
        run: |
          echo "::error title=Sesongskiftet er ikke klart::Byttedatoen er passert, men neste sesong er ikke oppdaget og validert. Siden viser en ferdigspilt sesong. Se loggen for steget «Sesongskifte»."
          exit 1
