name: Oppdater odds for kommende kamper

on:
  schedule:
    # Kl. 08 og 16 UTC hver dag -- selve kjøringen sjekker først om det er
    # noen vits (uspilte kamper innen 7 dager, og at kvoten hos The Odds API
    # ikke nylig ble lav), se scripts/should_fetch_odds.py.
    - cron: "13 8 * * *"
    - cron: "13 16 * * *"
  workflow_dispatch:
    inputs:
      planlagt:
        description: "Utlost av den eksterne planleggeren -- porten og kampvinduet skal gjelde som ved schedule"
        type: boolean
        default: false
      feil_arkivering:
        description: "Tving arkiveringen til aa feile, for aa teste at produksjonen gaar videre"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04   # låst 8.10.2026: ubuntu-latest blir Ubuntu 26 fra 19.10.
    steps:
      # Nyeste main, ikke commiten fra da kjøringen ble startet (8.10.2026):
      # den venter i køen update-data bak «Oppdater kampdata», som kan ha
      # pushet en ny model.json i mellomtiden, og da ga pushen herfra konflikt
      # i model.json (prøvekjøringen på Ubuntu 26.04).
      - uses: actions/checkout@v7
        with:
          ref: main

      # PORTEN FØRST. Planleggeren (planlegger/worker.js) starter workflowen
      # hvert tiende minutt i 09-21 UTC; porten avgjør om det hentes: kamper
      # innen 7 dager, kvoten ikke lav, én time sperre etter et mislykket
      # forsøk, og tidsporten: én henting per døgn (norsk tid), annenhver dag
      # under budsjettvakten. Oddsen rett før avspark kommer fra
      # prekick-odds.yml (Pinnacle), ikke herfra.
      # Se scripts/should_fetch_odds.py.
      - name: Sjekk om det er noen vits (tidsport, kamper innen 7 dager, kvote ikke lav)
        id: gate
        env:
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && !inputs.planlagt && 'true' || 'false' }}
        run: python3 scripts/should_fetch_odds.py

      # Point-in-time-arkiv i det PRIVATE lab-repoet. Tilbaketesten har bare
      # sluttodds, så vi kan ikke måle modeller som bruker markedsodds på
      # kommende kamper uten å lekke framtidsinformasjon. Dette bygger
      # datagrunnlaget for en ekte måling om ett til to år.
      #
      # Arkiveres TO ganger: først snapshotet som alt ligger i repoet, FØR
      # hentingen kan overskrive det -- da fanges et snapshot som gikk tapt
      # sist fordi arkiveringen feilet. Så det nye etterpå. Begge er
      # idempotente: filnavnet er hentetidspunktet, så et snapshot som
      # finnes fra før hoppes over.
      #
      # Kjøres bare når porten er åpen: snapshotet som ligger, overskrives
      # bare når det hentes, så det er da det må arkiveres først. (Før lå
      # steget foran porten uten vilkår; med planleggeren hvert tiende minutt
      # ville det klonet laben 72 ganger i døgnet uten nytte.) Skriptet bruker
      # bare standardbibliotek, saa det trenger ikke setup-python eller pip.
      - name: Arkiver forrige oddssnapshot (før henting)
        id: ark_for
        if: steps.gate.outputs.should_fetch == 'true'
        continue-on-error: true
        env:
          LAB_DEPLOY_KEY: ${{ secrets.LAB_DEPLOY_KEY }}
          ARKIV_TVING_FEIL: ${{ inputs.feil_arkivering && '1' || '' }}
        run: bash scripts/arkiver_til_lab.sh for-henting eliteserien

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.should_fetch == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter (numpy, scipy)
        if: steps.gate.outputs.should_fetch == 'true'
        run: pip install -r requirements.txt

      - name: Hent kommende odds, slå sammen kilder og tilpass modellen på nytt
        if: steps.gate.outputs.should_fetch == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/update_odds.py

      # Parallellkjøring: samme kamper hentet fra OddsPapi (Pinnacle og
      # bet365 hver for seg) og lagret side om side med The Odds API-snittet.
      # Modellen bruker fortsatt The Odds API -- dette samler bare inn, så
      # kildene kan sammenlignes på ekte kamper. Terminlisten koster 1 kall og
      # mellomlagres; oddsoppslagene er gratis.
      - name: Samle OddsPapi ved siden av, til sammenligning
        if: steps.gate.outputs.should_fetch == 'true'
        continue-on-error: true  # sammenligningen skal aldri stoppe oddsene
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python3 scripts/odds_compare.py

      - name: Arkiver nytt oddssnapshot (etter henting)
        id: ark_etter
        if: steps.gate.outputs.should_fetch == 'true'
        continue-on-error: true
        env:
          LAB_DEPLOY_KEY: ${{ secrets.LAB_DEPLOY_KEY }}
          ARKIV_TVING_FEIL: ${{ inputs.feil_arkivering && '1' || '' }}
        run: bash scripts/arkiver_til_lab.sh etter-henting eliteserien

      # Arkiveringen skal ikke velte produksjonsoppdateringen, men den skal
      # heller ikke forsvinne stille: et tapt snapshot er en observasjon vi
      # ikke får igjen. Feilen skrives derfor i jobbsammendraget, med liga og
      # hvilken av de to arkiveringene det gjelder.
      - name: Meld om arkiveringsfeil
        if: always()
        run: |
          feil=0
          for x in "for-henting:${{ steps.ark_for.outcome }}" \
                   "etter-henting:${{ steps.ark_etter.outcome }}"; do
            fase="${x%%:*}"; res="${x##*:}"
            if [ "$res" = "failure" ]; then
              echo "### Arkivering feilet: Eliteserien, $fase" >> "$GITHUB_STEP_SUMMARY"
              echo "Snapshotet kan være tapt. Se git-historikken til" >> "$GITHUB_STEP_SUMMARY"
              echo "\`eliteserien/data/odds_upcoming.json\` for å hente det inn manuelt." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Arkivering feilet::Eliteserien, $fase"
              feil=1
            fi
          done
          [ "$feil" = "0" ] && echo "Arkivering OK (begge faser)." >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Committer og pusher hvis noe endret seg
        if: always() && steps.gate.outputs.should_fetch == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eliteserien/data/odds_upcoming.json eliteserien/data/odds.json eliteserien/data/model.json
          [ -f eliteserien/data/odds_quota.json ] && git add eliteserien/data/odds_quota.json
          # Siste forsøk (tidsportens sperre), også når hentingen feilet.
          [ -f eliteserien/data/odds_hentestatus.json ] && git add eliteserien/data/odds_hentestatus.json
          [ -f eliteserien/data/odds_captured.json ] && git add eliteserien/data/odds_captured.json
          [ -f eliteserien/data/odds_sources.json ] && git add eliteserien/data/odds_sources.json
          [ -f eliteserien/data/oddspapi_fixtures.json ] && git add eliteserien/data/oddspapi_fixtures.json
          [ -f data/oddspapi_usage.json ] && git add data/oddspapi_usage.json
          # Katalogen finnes bare naar et tellende kall er gjort i dag.
          [ -d data/oddspapi-bruk ] && git add data/oddspapi-bruk
          # fotball.no-cachen: hoyst ett forsok per liga per dogn ligger her.
          [ -d data/nff-cache ] && git add data/nff-cache
          [ -d data/hentelogg ] && git add data/hentelogg
          if git diff --cached --quiet; then
            echo "Ingen endringer i odds."
          else
            git commit -m "Oppdater kommende odds $(date -u +%Y-%m-%dT%H:%MZ)"
            bash scripts/push_med_rebase.sh
          fi
