name: Oppdater odds for kommende kamper

on:
  schedule:
    # Kl. 08 og 16 UTC hver dag -- selve kjøringen sjekker først om det er
    # noen vits (uspilte kamper innen 7 dager, og at kvoten hos The Odds API
    # ikke nylig ble lav), se scripts/should_fetch_odds.py.
    - cron: "13 8 * * *"
    - cron: "13 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sjekk om det er noen vits (kamper innen 7 dager, kvote ikke lav)
        id: gate
        env:
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python3 scripts/should_fetch_odds.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_fetch == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter (numpy, scipy)
        if: steps.gate.outputs.should_fetch == 'true'
        run: pip install -r requirements.txt

      - name: Hent kommende odds, slå sammen kilder og tilpass modellen på nytt
        if: steps.gate.outputs.should_fetch == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/update_odds.py

      # Parallellkjøring: samme kamper hentet fra OddsPapi (Pinnacle og
      # bet365 hver for seg) og lagret side om side med The Odds API-snittet.
      # Modellen bruker fortsatt The Odds API -- dette samler bare inn, så
      # kildene kan sammenlignes på ekte kamper. Terminlisten koster 1 kall og
      # mellomlagres; oddsoppslagene er gratis.
      - name: Samle OddsPapi ved siden av, til sammenligning
        if: steps.gate.outputs.should_fetch == 'true'
        continue-on-error: true  # sammenligningen skal aldri stoppe oddsene
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python3 scripts/odds_compare.py

      # Point-in-time-arkiv i det PRIVATE lab-repoet. Tilbaketesten har bare
      # sluttodds, og kan derfor ikke måle modeller som bruker markedsodds på
      # kommende kamper uten å lekke framtidsinformasjon. Dette bygger
      # grunnlaget for en ekte måling om ett til to år.
      #
      # Nøkkelen (LAB_DEPLOY_KEY) er en deploy key med skrivetilgang BARE til
      # lab-repoet. Snapshotet havner aldri i dette repoet.
      #
      # continue-on-error: arkivet er en bonus, ikke produksjon. Feiler det,
      # skal oddshentingen gå videre som før.
      - name: Arkiver oddssnapshot i lab-repoet
        if: steps.gate.outputs.should_fetch == 'true' && env.LAB_KEY != ''
        continue-on-error: true
        env:
          LAB_KEY: ${{ secrets.LAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$LAB_KEY" > ~/.ssh/lab
          chmod 600 ~/.ssh/lab
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/lab -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:fiskentnt/tabellkalkulator-lab.git "$RUNNER_TEMP/lab"
          python3 scripts/arkiver_odds_snapshot.py "$RUNNER_TEMP/lab/odds-arkiv"
          cd "$RUNNER_TEMP/lab"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add odds-arkiv
          if git diff --cached --quiet; then
            echo "Ingen nye snapshot."
          else
            git commit -m "Oddssnapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
          rm -f ~/.ssh/lab

      - name: Committer og pusher hvis noe endret seg
        if: always() && steps.gate.outputs.should_fetch == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eliteserien/data/odds_upcoming.json eliteserien/data/odds.json eliteserien/data/model.json
          [ -f eliteserien/data/odds_quota.json ] && git add eliteserien/data/odds_quota.json
          [ -f eliteserien/data/odds_captured.json ] && git add eliteserien/data/odds_captured.json
          [ -f eliteserien/data/odds_sources.json ] && git add eliteserien/data/odds_sources.json
          [ -f eliteserien/data/oddspapi_fixtures.json ] && git add eliteserien/data/oddspapi_fixtures.json
          [ -f data/oddspapi_usage.json ] && git add data/oddspapi_usage.json
          if git diff --cached --quiet; then
            echo "Ingen endringer i odds."
          else
            git commit -m "Oppdater kommende odds $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
