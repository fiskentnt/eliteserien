name: "ELO-test: bygg modellen"

# Testversjonen under /elo-test/, med ELO-Odds 90 som grunnmodell. Rører INGEN
# produksjonsfil: skriver bare elo-test/emodell/, og committer bare når
# modellen eller prognoseloggen faktisk er endret. Uendret prognose gir ingen
# commit, og kontroll.py stopper lagringen. Se elo-test/README.md.
#
# LØS FRA 17.10.2026: bare modellen og prognoseloggen ut sesongen. Panelene
# (lastmatch, prekick, accuracy) regnes ikke lenger og står som de var;
# grunnlagsfilen og banneret regnes ikke av grunnlag.yml; ingen fletting av
# nye endringer fra hovedsiden. Prognoseloggen trengs etter sesongen
# (oddsvekten, ELO90 mot produksjonsmodellen).
#
# UTLØSES av de tre workflowene som skriver data testsiden leser:
#   Oppdater kampdata                    matches.json, fixtures.json, odds.json
#   Oppdater odds for kommende kamper    odds_upcoming.json (fetch_odds_upcoming.py)
#   Odds nær avspark                     odds_upcoming.json (prekick_odds.py)
# Alle tre pusher til main som et STEG i egen jobb, før workflowen er ferdig.
# workflow_run med types: [completed] starter derfor først etter pushen, og
# checkout med ref: main ser den nye filen.
on:
  workflow_run:
    workflows:
      - "Oppdater kampdata"
      - "Oppdater odds for kommende kamper"
      - "Odds nær avspark"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read                 # porten leser kjøringslisten (scripts/puljeport.py)

jobs:
  bygg:
    # Bare når porten (jobben port, nederst) sier at denne er den siste i
    # runden (8.10.2026). De tre utløserne startes samtidig hvert tiende
    # minutt, og hver av dem som blir ferdig, starter en kjøring: før bygde
    # den første og den siste, og den midterste ble avbrutt av GitHub (bare
    # én ventende per gruppe), 78 av 238 siste døgn 7.10., hver med e-posten
    # «Run failed». Uansett hvordan utløseren gikk, også avbrutt: den kan ha
    # committet data før den stoppet, og byggingen gjør ingenting når
    # ingenting er endret.
    needs: port
    if: needs.port.outputs.bygg == 'true'
    # Køen er her, ikke på hele workflowen: portene skal aldri stå i kø eller
    # bli avbrutt.
    concurrency:
      group: elo-test-bygg          # egen gruppe; køer testsidens jobber
      cancel-in-progress: false
    runs-on: ubuntu-24.04   # låst 8.10.2026: ubuntu-latest blir Ubuntu 26 fra 19.10.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: elo-test/requirements.txt

      # ELO-testens EGNE, laaste versjoner -- ikke produksjonens
      # requirements.txt, som har >=-grenser. Se elo-test/requirements.txt.
      - name: Installer avhengigheter (numpy, scipy, laast)
        run: pip install -r elo-test/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"      # kontroll D kjører sidens egen JS

      - name: Bygg ELO90-modellen
        run: python3 elo-test/scripts/bygg.py

      # MODELLKONTROLLENE (A til V og E, uten Chrome). Feiler en av dem, stopper
      # alt her: verken modellen, prognoseloggen eller panelene lagres.
      - name: Kontroller modellen
        run: python3 elo-test/scripts/kontroll.py

      # MODELLEN OG PROGNOSELOGGEN lagres FØR panelene, i egen commit. Panelene
      # (under) skal aldri stoppe dem: feiler panelsteget eller
      # kontroll_paneler.py, er modellen og prognoseloggen allerede pushet.
      - name: Lagre modellen og prognoseloggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add elo-test/emodell/model.json elo-test/emodell/meta.json elo-test/emodell/prognoselogg
          if git diff --cached --quiet; then
            echo "Modellen og prognoseloggen er uendret -- ingen commit."
          else
            git commit -m "ELO-test: modellen bygget $(date -u +%Y-%m-%dT%H:%MZ)"
            bash scripts/push_med_rebase.sh
          fi

  # PORTEN (8.10.2026): bygger bare når ingen av de tre utløserne kjører
  # fortsatt og det ikke finnes en nyere ELO-test-kjøring; ellers ender
  # kjøringen grønn uten å bygge, og loggen sier hvorfor (nyere kjøring eller
  # aktiv utløser). Manuelt: bygger alltid. Se scripts/puljeport.py. Står
  # nederst, så stegene over leses i rekkefølge (kontroll.py, O).
  port:
    runs-on: ubuntu-24.04   # låst 8.10.2026: ubuntu-latest blir Ubuntu 26 fra 19.10.
    timeout-minutes: 5
    outputs:
      bygg: ${{ steps.port.outputs.bygg }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/puljeport.py
          sparse-checkout-cone-mode: false

      - name: Er dette den siste i runden?
        id: port
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/puljeport.py elo
