name: "Måling: hvor mye flytter oddsen seg før avspark?"

# Manuell måling, ikke en del av datakjeden. Svarer på om en ekstra henting
# nær avspark er verdt det: leser hele prisrekken fra /v4/historical-odds
# (gratis) og sammenligner dagen før, den vanlige hentingen og
# sluttoddsvinduet 60-15 minutter før avspark, mot resultatet.
#
# Kallbruk: terminlisten for OBOS ligger ferdig mellomlagret (0 tellende
# kall). For Eliteserien hentes sesongens terminliste én gang og lagres, så
# senere kjøringer også koster 0. Markedslisten leses fra mellomlageret.
#
# prisrekker=true: hele 1X2-prisrekken per kamp (odds_drift.py --serier), til
# studien av markedsvekten. Rekkene er tredjepartsdata og går rett til det
# PRIVATE lab-repoet (odds-prisrekker/). De lastes ikke opp som artefakt, og
# radene for de fire avlesningspunktene skrives ikke i den kjøringen, så
# ingenting havner offentlig.
on:
  workflow_dispatch:
    inputs:
      ligaer:
        description: "Hvilke ligaer (mellomrom mellom)"
        default: "obos eliteserien"
      prisrekker:
        description: "Hent hele prisrekken til laben (ingen offentlig artefakt)"
        type: boolean
        default: false
      maks:
        description: "Høyst så mange kamper per liga (tomt = alle)"
        default: ""

permissions:
  contents: write

concurrency:
  group: odds-drift
  cancel-in-progress: false

jobs:
  mal:
    runs-on: ubuntu-24.04   # låst 8.10.2026: ubuntu-latest blir Ubuntu 26 fra 19.10.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Mål flyttingen
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          for liga in ${{ inputs.ligaer || 'obos eliteserien' }}; do
            echo "########## $liga ##########"
            if [ "${{ inputs.prisrekker }}" = "true" ]; then
              python3 scripts/odds_drift.py "$liga" --max "${{ inputs.maks || 400 }}" --serier "prisrekker_$liga.json" || true
            else
              python3 scripts/odds_drift.py "$liga" --dump "drift_$liga.json" || true
            fi
          done

      - name: Arkiver prisrekkene i laben (privat)
        if: inputs.prisrekker
        env:
          LAB_DEPLOY_KEY: ${{ secrets.LAB_DEPLOY_KEY }}
        run: bash scripts/arkiver_til_lab.sh prisrekker prisrekker_*.json

      - name: Ta vare på radene
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odds-drift
          path: drift_*.json
          if-no-files-found: ignore

      - name: Lagre kalltelleren og terminlisten
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/hentelogg data/nff-cache eliteserien/data/oddspapi_markets.json obos/data/oddspapi_markets.json data/oddspapi_usage.json data/oddspapi-bruk eliteserien/data/oddspapi_fixtures_2026.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Ingen endring."
          else
            git commit -m "Måling: oddsbevegelse før avspark (kallteller og terminliste)"
            git pull --rebase --autostash origin main || true
            bash scripts/push_med_rebase.sh
          fi
