name = "tabellkalkulator-planlegger"
main = "worker.js"
compatibility_date = "2026-09-25"

# Hvert tiende minutt. Timefilteret (09-21 UTC) ligger i worker.js, ikke her,
# slik at det er ett sted aa endre og det stedet er versjonert i repoet.
[triggers]
crons = ["*/10 * * * *"]

[vars]
GREN = "main"

# TO hemmeligheter, begge lagt inn interaktivt og ALDRI i denne filen, i
# koden eller i git:
#
#   npx wrangler secret put GITHUB_TOKEN      fine-grained PAT
#   npx wrangler secret put UTLOSER_NOKKEL    nokkel for manuell utlosning
#
# Kommandoen spor om verdien og leser den uten aa vise den, saa den havner
# verken i terminalhistorikken eller i prosesslisten.
