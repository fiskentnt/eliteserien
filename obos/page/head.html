<script>
// Kjøres synkront i <head>, før noe rekker å tegnes: leser et eventuelt lagret
// temavalg og setter data-theme med en gang, slik at siden aldri først blinker
// i systemfargen og så hopper til det lagrede valget et øyeblikk senere. Uten
// lagret valg settes ingenting her -- CSS-en sin egen @media(prefers-color-
// scheme) tar seg av systeminnstillingen helt av seg selv (se :root-reglene).
(function(){
  try{
    const saved = localStorage.getItem('theme');
    if(saved==='dark'||saved==='light') document.documentElement.dataset.theme = saved;
  }catch(e){}
})();
</script>
